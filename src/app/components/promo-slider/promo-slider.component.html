<section
  class="slider"
  id="inicio"
>

  @for (
    banner of banners;
    track $index
  ) {

    <article
      class="slide"
      [class.active]="
        $index === currentIndex
      "
    >

      <img
        [src]="banner.imagen"
        [alt]="banner.titulo"
      >

      <div class="overlay"></div>


      <div class="slide-content">

        <span>
          FRAN INDUMENTARIA
        </span>

        <h1>
          {{ banner.titulo }}
        </h1>

        <p>
          {{ banner.subtitulo }}
        </p>

        <a [href]="banner.link">
          {{ banner.boton }}
        </a>

      </div>

    </article>

  }


  <button
    class="arrow previous"
    (click)="previous()"
    aria-label="Anterior"
  >
    ‹
  </button>


  <button
    class="arrow next"
    (click)="next()"
    aria-label="Siguiente"
  >
    ›
  </button>


  <div class="indicators">

    @for (
      banner of banners;
      track $index
    ) {

      <button
        [class.active]="
          $index === currentIndex
        "
        (click)="goTo($index)"
        [attr.aria-label]="
          'Ir al banner ' + ($index + 1)
        "
      >
      </button>

    }

  </div>

</section>
