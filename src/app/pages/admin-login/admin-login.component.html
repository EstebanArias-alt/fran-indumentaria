<section class="admin-login">

  <div class="login-card">

    <div class="marca">
      FRAN INDUMENTARIA
    </div>

    <h1>Administración</h1>

    <p class="descripcion">
      Ingresá para administrar los productos
      de la tienda.
    </p>


    <form
      (ngSubmit)="iniciarSesion()"
    >

      <div class="campo">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="admin@noeliainnovaciones.com"
          autocomplete="email"
          required
        >

      </div>


      <div class="campo">

        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="••••••••"
          autocomplete="current-password"
          required
        >

      </div>


      @if (error) {

        <div class="error">
          {{ error }}
        </div>

      }


      <button
        type="submit"
        [disabled]="cargando"
      >

        @if (cargando) {
          Ingresando...
        } @else {
          Iniciar sesión
        }

      </button>

    </form>

  </div>

</section>
